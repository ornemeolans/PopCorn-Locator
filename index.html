<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas y Series</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header role="banner">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo-link" aria-label="PopCorn Locator - Inicio">
                    <div class="logo-svg" aria-hidden="true">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 10H33L30 35H10L7 10Z" fill="#FFC107"/> 
                            <path d="M7 10L10 35M33 10L30 35" stroke="#3182CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> 
                            <path d="M10 35H30" stroke="#3182CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M7 10C9.33333 8.33333 13 5 20 5C27 5 30.6667 8.33333 33 10H7Z" fill="#00A389"/> 
                            <circle cx="15" cy="10" r="3" fill="#f4f4f4"/> 
                            <circle cx="25" cy="10" r="3" fill="#f4f4f4"/> 
                            <circle cx="20" cy="7" r="3" fill="#f4f4f4"/> 
                            <path d="M20 12C15.5817 12 12 15.5817 12 20C12 25.0476 18.0697 31.7915 20 33.6897C21.9303 31.7915 28 25.0476 28 20C28 15.5817 24.4183 12 20 12Z" fill="#7951a8"/> 
                            <circle cx="20" cy="20" r="4" fill="#f4f4f4"/> 
                        </svg>
                    </div>
                    <h1 class="logo-text">PopCorn Locator</h1>
                </a>
            </div>
            <div class="search-container" role="search">
                <div class="input-suggestions-wrapper">
                    <label for="search-input" class="visually-hidden">Buscar películas, series o actores</label>
                    <input type="text" id="search-input" class="search-input" placeholder="Buscar películas, series o actores..." aria-describedby="search-input-desc">
                    <span id="search-input-desc" class="visually-hidden">Escribe al menos 3 caracteres para ver sugerencias</span>
                    <div id="suggestions-list" class="suggestions-list" role="listbox" aria-label="Sugerencias de búsqueda"></div>
                </div>
                <button class="search-button" aria-label="Buscar">Buscar</button>
                <button class="reset-button" id="reset-button" aria-label="Resetear búsqueda">Resetear</button> 
            </div>
            <div class="filter-container" role="group" aria-label="Filtros de tipo de contenido">
                <button class="filter-button active" data-type="all" role="radio" aria-checked="true">Todo</button>
                <button class="filter-button" data-type="movie" role="radio" aria-checked="false">Películas</button>
                <button class="filter-button" data-type="series" role="radio" aria-checked="false">Series</button>
                <button class="filter-button" data-type="actor" role="radio" aria-checked="false">Actores</button>
                <button class="favorites-toggle-btn" id="favorites-toggle" role="radio" aria-checked="false">❤️ Favoritos</button>
            </div>
            <!-- Filtros Avanzados -->
            <div class="advanced-filters" id="advanced-filters" style="display: none;">
                <select id="genre-filter" class="genre-select" aria-label="Filtrar por género">
                    <option value="">Todos los géneros</option>
                </select>
                <select id="year-filter" class="year-select" aria-label="Filtrar por año">
                    <option value="">Todos los años</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container" role="main">
        <div class="search-info" id="search-info" aria-live="polite">
            </div>
        <div class="results-container" id="results-container" role="region" aria-label="Resultados de búsqueda">
            </div>
        <div class="pagination" id="pagination" role="navigation" aria-label="Paginación de resultados">
            </div>
    </main>

    <div class="modal" id="movie-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <div class="modal-content">
            <button class="close-button" id="close-modal" aria-label="Cerrar detalles">&times;</button>
            <div class="detail-container" id="detail-container">
                </div>
        </div>
    </div>

    <!-- Templates HTML para reutilización -->
    <template id="movie-card-template">
        <article class="movie-card" tabindex="0" role="button" aria-label="Ver detalles">
            <img src="" alt="" class="movie-poster" loading="lazy">
            <div class="movie-info">
                <h3 class="movie-title"></h3>
                <div class="movie-year"></div>
                <div class="movie-rating">
                    <span class="star">★</span>
                    <span class="rating-value"></span>
                </div>
            </div>
        </article>
    </template>

    <template id="actor-card-template">
        <article class="actor-card" tabindex="0" role="button" aria-label="Ver detalles del actor">
            <img src="" alt="" class="actor-photo" loading="lazy">
            <div class="actor-info">
                <h3 class="actor-name"></h3>
                <div class="actor-known-for"></div>
                <div class="actor-role"></div>
            </div>
        </article>
    </template>

    <script src="js/app.js" type="module"></script>
</body>
</html>
